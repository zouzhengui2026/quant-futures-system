[project]
name = "quant-futures-system"
version = "0.1.0"
description = "Crypto perpetual futures quantitative trading system"
requires-python = ">=3.11"
[project.scripts]
quant-futures = "quant_futures.product.cli:main"

[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
